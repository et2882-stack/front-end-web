<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music | Pixel Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="desktop music-desktop">
        <nav class="desktop-icons" aria-label="Desktop shortcuts">
            <a class="desktop-icon" href="gallery.html">
                <img src="assets/gallery.png" alt="">
                <span>Gallery</span>
            </a>
            <a class="desktop-icon" href="works.html">
                <img src="assets/works.png" alt="">
                <span>Works</span>
            </a>
            <a class="desktop-icon" href="about-me.html">
                <img src="assets/about_me.png" alt="">
                <span>About Me</span>
            </a>
            <a class="desktop-icon" href="music.html">
                <img src="assets/music-1.png.png" alt="">
                <span>Music</span>
            </a>
        </nav>
        <section class="window music-window" aria-label="Music window">
            <header class="title-bar">
                <h1>Music</h1>
                <a class="close-button" href="index.html" aria-label="Close Music and return home">
                    <img src="assets/close.png" alt="">
                </a>
            </header>
            <div class="window-content">
                <h2>My Music</h2>
                <img src="assets/cd.png" alt="Music cover" width="150" height="150">
                <p>Here are some of my favorite tracks.</p>
                <div class="music-item">
                    <img src="assets/placeholder.png" alt="Music cover">
                    <div>
                        <h3>Track 1</h3>
                        <p>Artist - Album</p>
                    </div>
                </div>
                <div class="music-item">
                    <img src="assets/placeholder.png" alt="Music cover">
                    <div>
                        <h3>Track 2</h3>
                        <p>Artist - Album</p>
                    </div>
                </div>
                <div class="music-item">
                    <img src="assets/placeholder.png" alt="Music cover">
                    <div>
                        <h3>Track 3</h3>
                        <p>Artist - Album</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
