<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works | Pixel Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop">
    <nav class="desktop-icons" aria-label="Desktop shortcuts">
      <a class="desktop-icon" href="gallery.html">
        <img src="assets/gallery.png" alt="">
        <span>Gallery</span>
      </a>
      <a class="desktop-icon" href="works.html">
        <img src="assets/works.png" alt="">
        <span>Works</span>
      </a>
      <a class="desktop-icon" href="about-me.html">
        <img src="assets/about_me.png" alt="">
        <span>About Me</span>
      </a>
      <a class="desktop-icon" href="music.html">
        <img src="assets/music-1.png.png" alt="">
        <span>Music</span>
      </a>
    </nav>

    <section class="window works-window" aria-label="Works window">
      <header class="title-bar">
        <h1>Works</h1>
        <a class="close-button" href="index.html" aria-label="Close Works and return home">
          <img src="assets/close.png" alt="">
        </a>
      </header>
      <div class="window-content works-content">
        <h2>My Works</h2>
        <p>Here are some of my projects.</p>
        <div class="work-item">
          <img src="assets/placeholder.png" alt="Project preview">
          <div>
            <h3>Project 1</h3>
            <p>A short description of the project goes here.</p>
          </div>
        </div>
        <div class="work-item">
          <img src="assets/placeholder.png" alt="Project preview">
          <div>
            <h3>Project 2</h3>
            <p>Add a little information about what you made.</p>
          </div>
        </div>
        <div class = "work-item">
          <img src="assets/placeholder.png" alt="Project preview">
          <div>
            <h3>Project 3</h3>
            <p>Another description of the project goes here.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
